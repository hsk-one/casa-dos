<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Dos · Cebu Plate Scout · Interactive 3D</title>
<style>
:root{--accent:#EF9F27;--bg:#0a0a10;--panel:rgba(0,0,0,.62);--border:rgba(255,255,255,.08);--text:#f5f4ef}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;overflow:hidden}
.cd-c{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(180deg,#171520 0%,#0a0a10 60%,#000 100%)}
.cd-cv{width:100%;height:100%;cursor:grab;display:block}
.cd-cv:active{cursor:grabbing}
.cd-h{position:absolute;padding:10px 14px;border-radius:10px;background:var(--panel);color:#fff;font-size:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);pointer-events:none}
.cd-h.tl{top:14px;left:14px;max-width:260px}
.cd-h.tr{top:14px;right:14px;min-width:170px}
.cd-h.bl{bottom:96px;left:14px;font-size:10.5px;opacity:.75;pointer-events:none}
.cd-cmp{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);border-radius:50%;width:78px;height:78px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);pointer-events:none}
.cd-ctrl{position:absolute;bottom:14px;left:14px;right:14px;background:rgba(0,0,0,.7);padding:11px 16px;border-radius:11px;color:#fff;font-size:13px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cd-seg{display:flex;gap:3px;background:rgba(255,255,255,.08);padding:3px;border-radius:7px}
.cd-btn{background:transparent;color:#fff;border:0;padding:6px 11px;border-radius:5px;font-size:12px;cursor:pointer;opacity:.7;transition:all .15s;font-family:inherit;font-weight:400}
.cd-btn:hover{opacity:1}
.cd-btn.on{background:rgba(239,159,39,.85);opacity:1;color:#1a1208;font-weight:500}
.cd-sl{flex:1;min-width:140px;cursor:pointer;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.15);height:4px;border-radius:2px}
.cd-sl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px rgba(239,159,39,.3)}
.cd-sl::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:0}
.cd-tl{font-weight:500;min-width:72px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
@media (max-width:600px){
  .cd-c{height:100dvh}
  .cd-h.tl{max-width:135px;padding:7px 9px}
  .cd-h.tl div{font-size:9.5px}
  .cd-h.tl div:first-child{font-size:11px}
  .cd-h.tr{min-width:108px;padding:7px 9px}
  .cd-h.tr div{font-size:9.5px}
  .cd-h.tr div:nth-child(2){font-size:12px}
  .cd-cmp{width:54px;height:54px;top:8px}
  .cd-h.bl{display:none}
  .cd-ctrl{bottom:100px;padding:10px 12px;gap:7px}
  .cd-btn{padding:5px 8px;font-size:11px}
  .cd-tl{min-width:60px;font-size:11px}
  .cd-sl{min-width:120px}
}
</style>
</head>
<body>
<div class="cd-c" id="cd-c">
<canvas id="cd-cv" class="cd-cv"></canvas>
<div class="cd-h tl">
<div style="font-weight:600;font-size:14px">Casa Dos · Plate Day Scout</div>
<div style="font-size:10.5px;opacity:.65;margin-top:3px">Cebu 10.327°N · May 5, 2026 · 6 AM all-hands</div>
<div style="font-size:10px;opacity:.55;margin-top:5px">balcony 155° SE · L-shape footprint · iron banister stairwell</div>
</div>
<svg class="cd-cmp" viewBox="-40 -40 80 80">
<circle cx="0" cy="0" r="36" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
<g id="cd-cmp-rot" transform="rotate(-155)">
<polygon points="0,-32 -5,-22 5,-22" fill="#ff5860"/>
<text x="0" y="-32" fill="#ff5860" font-size="10" text-anchor="middle" font-family="sans-serif" font-weight="500" transform="translate(0,-3)">N</text>
<text x="0" y="36" fill="#aaa" font-size="9" text-anchor="middle" font-family="sans-serif">S</text>
<text x="36" y="3" fill="#aaa" font-size="9" text-anchor="middle" font-family="sans-serif">E</text>
<text x="-36" y="3" fill="#aaa" font-size="9" text-anchor="middle" font-family="sans-serif">W</text>
</g>
<text x="0" y="2" fill="rgba(255,255,255,.5)" font-size="7" text-anchor="middle" font-family="sans-serif">geo</text>
</svg>
<div class="cd-h tr">
<div style="font-size:10px;opacity:.65">Sun</div>
<div id="cd-tt" style="font-weight:500;margin:1px 0;font-size:14px">9:00 AM</div>
<div id="cd-sa" style="font-size:10px;opacity:.75;font-variant-numeric:tabular-nums">geo az 75° · alt 50°</div>
</div>
<div class="cd-h bl">drag = rotate · scroll = zoom · tap times to scrub</div>
<div class="cd-ctrl">
<div class="cd-seg">
<button class="cd-btn on" data-v="iso">3D</button>
<button class="cd-btn" data-v="top">Plan</button>
<button class="cd-btn" data-v="cine">Cine</button>
</div>
<div class="cd-seg">
<button class="cd-btn" data-j="6">6a</button>
<button class="cd-btn" data-j="7.5">7:30</button>
<button class="cd-btn" data-j="9">9a</button>
<button class="cd-btn" data-j="12.13">noon</button>
<button class="cd-btn" data-j="15">3p</button>
<button class="cd-btn" data-j="17">5p</button>
</div>
<input type="range" id="cd-s" class="cd-sl" min="5.6" max="18" step="0.05" value="9">
<span class="cd-tl" id="cd-tl">9:00 AM</span>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const C=document.getElementById('cd-c'),cv=document.getElementById('cd-cv');
const cmpRot=document.getElementById('cd-cmp-rot');
let W=C.clientWidth,H=C.clientHeight;
const sc=new THREE.Scene();sc.fog=new THREE.Fog(0x0a0a14,55,140);
const cam=new THREE.PerspectiveCamera(40,W/H,0.1,300);
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
r.setSize(W,H);r.setPixelRatio(Math.min(devicePixelRatio,2));
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputEncoding=THREE.sRGBEncoding;
let rx=-Math.PI/4,ry=Math.PI/8,d=42,trx=rx,try_=ry,td=d;
let drag=false,lx=0,ly=0;
function camUpd(){rx+=(trx-rx)*.12;ry+=(try_-ry)*.12;d+=(td-d)*.12;
const cx=10,cz=8;
cam.position.set(cx+d*Math.cos(rx)*Math.sin(ry),-d*Math.sin(rx)+1,cz+d*Math.cos(rx)*Math.cos(ry));
cam.lookAt(cx,1,cz);
const cmpAngle=(-155)-(ry*180/Math.PI);
cmpRot.setAttribute('transform',`rotate(${cmpAngle})`);}
cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('mousemove',e=>{if(!drag)return;try_-=(e.clientX-lx)*.005;trx=Math.max(-Math.PI/2+.05,Math.min(-.05,trx-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
addEventListener('mouseup',()=>drag=false);
cv.addEventListener('wheel',e=>{e.preventDefault();td=Math.max(18,Math.min(90,td+e.deltaY*.06))},{passive:false});
let tD=0;
cv.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY}else if(e.touches.length===2){tD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}});
cv.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){try_-=(e.touches[0].clientX-lx)*.005;trx=Math.max(-Math.PI/2+.05,Math.min(-.05,trx-(e.touches[0].clientY-ly)*.005));lx=e.touches[0].clientX;ly=e.touches[0].clientY;e.preventDefault()}else if(e.touches.length===2){const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);td=Math.max(18,Math.min(90,td-(nd-tD)*.06));tD=nd;e.preventDefault()}},{passive:false});
cv.addEventListener('touchend',()=>drag=false);

const amb=new THREE.AmbientLight(0xffffff,.4);sc.add(amb);
const sun=new THREE.DirectionalLight(0xffeecc,1.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
sun.shadow.camera.near=.5;sun.shadow.camera.far=120;sun.shadow.bias=-.0008;
sc.add(sun);sc.add(sun.target);
sc.add(new THREE.HemisphereLight(0xb8c8e0,0x4a3a30,.32));

const gr=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x14141a,roughness:1}));
gr.rotation.x=-Math.PI/2;gr.position.y=-.02;gr.receiveShadow=true;sc.add(gr);

const S=0.035, C0={x:80,z:215};
function W2(svgX,svgZ){return [(svgX-C0.x)*S,(svgZ-C0.z)*S]}
const ROOMS={P:{x1:80,z1:215,x2:200,z2:470},HL:{x1:80,z1:475,x2:200,z2:590},E:{x1:200,z1:215,x2:450,z2:625},G:{x1:454,z1:215,x2:620,z2:740},B:{x1:200,z1:85,x2:450,z2:185}};
const CH=3.6, DH=2.8, WT=0.16, SILL=0.5, WTOP=2.85;

const M={
  wall:new THREE.MeshStandardMaterial({color:0xefe6d5,roughness:.85}),
  wood:new THREE.MeshStandardMaterial({color:0x4a2e1f,roughness:.65}),
  woodLite:new THREE.MeshStandardMaterial({color:0x5a3825,roughness:.7}),
  woodMid:new THREE.MeshStandardMaterial({color:0x6e4530,roughness:.65}),
  woodPanel:new THREE.MeshStandardMaterial({color:0x6a4028,roughness:.6}),
  trim:new THREE.MeshStandardMaterial({color:0x3a2818,roughness:.7}),
  iron:new THREE.MeshStandardMaterial({color:0x18181c,roughness:.45,metalness:.55}),
  marble:new THREE.MeshStandardMaterial({color:0xcfc8b8,roughness:.4}),
  cloth:new THREE.MeshStandardMaterial({color:0x6b1e2e,roughness:.85}),
  white:new THREE.MeshStandardMaterial({color:0xfafaf6,roughness:.5}),
  lat:new THREE.MeshStandardMaterial({color:0x2d4d35,roughness:.7}),
  shade:new THREE.MeshStandardMaterial({color:0xeae0c5,roughness:.85}),
  glassC:new THREE.MeshStandardMaterial({color:0xa8c0d8,transparent:true,opacity:.22,roughness:.15,emissive:0x223344,emissiveIntensity:.04}),
  glassY:new THREE.MeshStandardMaterial({color:0xf4c12e,transparent:true,opacity:.65,roughness:.2,emissive:0x5a3508,emissiveIntensity:.3}),
  glassF:new THREE.MeshStandardMaterial({color:0xe8e4d8,transparent:true,opacity:.32,roughness:.55}),
  tile:new THREE.MeshStandardMaterial({color:0x9a9a92,roughness:.6})
};
const bg=new THREE.Group();sc.add(bg);

function floor(rk,col){const r=ROOMS[rk];const [x1,z1]=W2(r.x1,r.z1),[x2,z2]=W2(r.x2,r.z2);
const w=x2-x1,d=z2-z1;
const f=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M.wood);
f.rotation.x=-Math.PI/2;f.position.set((x1+x2)/2,0,(z1+z2)/2);f.receiveShadow=true;bg.add(f);
const tint=new THREE.Mesh(new THREE.PlaneGeometry(w-.05,d-.05),new THREE.MeshStandardMaterial({color:col,roughness:.92,transparent:true,opacity:.22}));
tint.rotation.x=-Math.PI/2;tint.position.set((x1+x2)/2,.005,(z1+z2)/2);tint.receiveShadow=true;bg.add(tint);}
floor('P',0xEF9F27);floor('HL',0x888880);floor('E',0x1D9E75);floor('G',0xD85A30);
{const r=ROOMS.B;const[x1,z1]=W2(r.x1,r.z1),[x2,z2]=W2(r.x2,r.z2);
const f=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),M.tile);
f.rotation.x=-Math.PI/2;f.position.set((x1+x2)/2,0,(z1+z2)/2);f.receiveShadow=true;bg.add(f);}

function wall(x1,z1,x2,z2,mat=M.wall,t=WT,h=CH){const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz);if(L<.01)return;
const w=new THREE.Mesh(new THREE.BoxGeometry(t,h,L),mat);
w.position.set((x1+x2)/2,h/2,(z1+z2)/2);w.rotation.y=Math.atan2(dx,dz);
w.castShadow=true;w.receiveShadow=true;bg.add(w);return w;}
function wallY(x1,z1,x2,z2,yMin,yMax,mat=M.wall,t=WT){const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz);
if(L<.01||(yMax-yMin)<.01)return;
const w=new THREE.Mesh(new THREE.BoxGeometry(t,yMax-yMin,L),mat);
w.position.set((x1+x2)/2,(yMin+yMax)/2,(z1+z2)/2);w.rotation.y=Math.atan2(dx,dz);
w.castShadow=true;w.receiveShadow=true;bg.add(w);return w;}
function transom(x1,z1,x2,z2,mat=M.glassC){const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz);if(L<.01)return;
const ang=Math.atan2(dx,dz),tH=CH-DH-.1;
const g=new THREE.Mesh(new THREE.BoxGeometry(.08,tH,L*.92),mat);
g.position.set((x1+x2)/2,DH+.05+tH/2,(z1+z2)/2);g.rotation.y=ang;bg.add(g);
const lf=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,L),M.trim);
lf.position.set((x1+x2)/2,DH+.04,(z1+z2)/2);lf.rotation.y=ang;bg.add(lf);
const tf=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,L),M.trim);
tf.position.set((x1+x2)/2,CH-.04,(z1+z2)/2);tf.rotation.y=ang;bg.add(tf);}
function swungDoor(hX,hZ,dir,hW,hgt=DH,mat=M.glassC){let w,d, x,z;
if(dir==='Z+'){w=.04;d=hW;x=hX;z=hZ+hW/2;}
else if(dir==='Z-'){w=.04;d=hW;x=hX;z=hZ-hW/2;}
else if(dir==='X+'){w=hW;d=.04;x=hX+hW/2;z=hZ;}
else{w=hW;d=.04;x=hX-hW/2;z=hZ;}
const dr=new THREE.Mesh(new THREE.BoxGeometry(w,hgt,d),mat);
dr.position.set(x,hgt/2,z);dr.castShadow=true;bg.add(dr);}
function closedPanel(x1,z1,x2,z2,hgt=DH,mat=M.glassC,bs=false){const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
const g=new THREE.Mesh(new THREE.BoxGeometry(.06,hgt,L*.95),mat);
g.position.set((x1+x2)/2,hgt/2,(z1+z2)/2);g.rotation.y=ang;bg.add(g);
if(bs){const bp=new THREE.Mesh(new THREE.BoxGeometry(.06,.55,L*.93),M.woodLite);
bp.position.set((x1+x2)/2,.275,(z1+z2)/2);bp.rotation.y=ang;bg.add(bp);}
const ft=new THREE.Mesh(new THREE.BoxGeometry(.08,.06,L),M.trim);
ft.position.set((x1+x2)/2,hgt-.03,(z1+z2)/2);ft.rotation.y=ang;bg.add(ft);}
function windowOpening(x1,z1,x2,z2,sill=SILL,top=WTOP){wallY(x1,z1,x2,z2,top,CH);wallY(x1,z1,x2,z2,0,sill);
const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
const cx=(x1+x2)/2,cz=(z1+z2)/2,wH=top-sill;
const g=new THREE.Mesh(new THREE.BoxGeometry(.04,wH,L*.92),M.glassC);
g.position.set(cx,sill+wH/2,cz);g.rotation.y=ang;bg.add(g);
const sl=new THREE.Mesh(new THREE.BoxGeometry(.26,.1,L*1.02),M.trim);
sl.position.set(cx,sill,cz);sl.rotation.y=ang;bg.add(sl);
const tt=new THREE.Mesh(new THREE.BoxGeometry(.26,.1,L*1.02),M.trim);
tt.position.set(cx,top,cz);tt.rotation.y=ang;bg.add(tt);
const fL=new THREE.Mesh(new THREE.BoxGeometry(.18,wH,.06),M.trim);
fL.position.set(x1,sill+wH/2,z1);fL.rotation.y=ang;bg.add(fL);
const fR=new THREE.Mesh(new THREE.BoxGeometry(.18,wH,.06),M.trim);
fR.position.set(x2,sill+wH/2,z2);fR.rotation.y=ang;bg.add(fR);
const mm=new THREE.Mesh(new THREE.BoxGeometry(.18,wH,.05),M.trim);
mm.position.set(cx,sill+wH/2,cz);mm.rotation.y=ang;bg.add(mm);
const rs=new THREE.Mesh(new THREE.BoxGeometry(.06,.25,L*.85),M.shade);
rs.position.set(cx,top-.18,cz);rs.rotation.y=ang;bg.add(rs);}

const PWX=W2(80,0)[0],PEX=W2(200,0)[0];
const PNZ=W2(0,215)[1],PSZ=W2(0,470)[1],HSZ=W2(0,590)[1];
const SNZ=W2(0,215)[1],SSZ=W2(0,625)[1];
const SWX=W2(200,0)[0],SEX=W2(450,0)[0];
const GWX=W2(454,0)[0],GEX=W2(620,0)[0],GNZ=W2(0,215)[1],GSZ=W2(0,740)[1];

// PEQUEÑA
const D1A=W2(0,295)[1],D1B=W2(0,355)[1],D2A=W2(0,375)[1],D2B=W2(0,435)[1];
wall(PWX,PNZ,PWX,D1A);wall(PWX,D1B,PWX,D2A);wall(PWX,D2B,PWX,PSZ);
function archedWindow(z1,z2,xWall){const len=z2-z1,fullH=DH+.4;
const g=new THREE.Mesh(new THREE.BoxGeometry(.06,fullH,len*.92),M.glassC);g.position.set(xWall,fullH/2,(z1+z2)/2);bg.add(g);
const ft=new THREE.Mesh(new THREE.BoxGeometry(.08,.05,len*.95),M.trim);ft.position.set(xWall,fullH-.03,(z1+z2)/2);bg.add(ft);
const fL=new THREE.Mesh(new THREE.BoxGeometry(.08,fullH,.05),M.trim);fL.position.set(xWall,fullH/2,z1+.025);bg.add(fL);
const fR=new THREE.Mesh(new THREE.BoxGeometry(.08,fullH,.05),M.trim);fR.position.set(xWall,fullH/2,z2-.025);bg.add(fR);
const mh=new THREE.Mesh(new THREE.BoxGeometry(.08,.04,len*.95),M.trim);mh.position.set(xWall,DH*.55,(z1+z2)/2);bg.add(mh);
const bp=new THREE.Mesh(new THREE.BoxGeometry(.06,.55,len*.92),M.woodLite);bp.position.set(xWall,.275,(z1+z2)/2);bg.add(bp);}
archedWindow(D1A,D1B,PWX);archedWindow(D2A,D2B,PWX);

const PND=[W2(110,0)[0],W2(160,0)[0]];
wall(PWX,PNZ,PND[0],PNZ);wall(PND[1],PNZ,PEX,PNZ);transom(PND[0],PNZ,PND[1],PNZ);
wall(PWX,PSZ,PEX,PSZ);
{const wbx=(PWX+PEX)/2;
const wb=new THREE.Mesh(new THREE.BoxGeometry(1.5,1,.04),M.white);wb.position.set(wbx,1.5,PSZ-.1);bg.add(wb);
const wbf=new THREE.Mesh(new THREE.BoxGeometry(1.55,1.05,.02),M.trim);wbf.position.set(wbx,1.5,PSZ-.108);bg.add(wbf);}

const SDA=W2(0,310)[1],SDB=W2(0,390)[1];
wall(PEX,PNZ,PEX,SDA);wall(PEX,SDB,PEX,PSZ);
const sdHalf=(SDB-SDA)/2;
swungDoor(PEX,SDA,'X-',sdHalf,DH,M.woodLite);swungDoor(PEX,SDB,'X-',sdHalf,DH,M.woodLite);
transom(PEX,SDA,PEX,SDB,M.glassY);

// HALLWAY
wall(PWX,W2(0,475)[1],PEX,W2(0,475)[1]);wall(PWX,W2(0,475)[1],PWX,HSZ);wall(PWX,HSZ,PEX,HSZ);
wall(PEX,W2(0,475)[1],PEX,W2(0,525)[1]);wall(PEX,W2(0,570)[1],PEX,HSZ);

// STAIR HALL
const NB1=[W2(245,0)[0],W2(285,0)[0]],NB2=[W2(295,0)[0],W2(365,0)[0]],NB3=[W2(375,0)[0],W2(415,0)[0]];
wall(SWX,SNZ,NB1[0],SNZ);wall(NB1[1],SNZ,NB2[0],SNZ);wall(NB2[1],SNZ,NB3[0],SNZ);wall(NB3[1],SNZ,SEX,SNZ);
closedPanel(NB1[0],SNZ,NB1[1],SNZ,DH,M.glassC,true);closedPanel(NB3[0],SNZ,NB3[1],SNZ,DH,M.glassC,true);
const nb2Half=(NB2[1]-NB2[0])/2;
swungDoor(NB2[0],SNZ,'Z+',nb2Half);swungDoor(NB2[1],SNZ,'Z+',nb2Half);
transom(NB1[0],SNZ,NB1[1],SNZ);transom(NB2[0],SNZ,NB2[1],SNZ);transom(NB3[0],SNZ,NB3[1],SNZ);

const BD=[W2(395,0)[0],W2(445,0)[0]];
const YW_A=W2(265,0)[0],YW_B=W2(315,0)[0],YW_SILL=1.0,YW_TOP=2.6;

const SUN_ROT=-155*Math.PI/180;
function sunP(h){const ph=10.327*Math.PI/180,de=16.13*Math.PI/180;
const Hh=(h-12-.13)*15*Math.PI/180;
const sa=Math.sin(ph)*Math.sin(de)+Math.cos(ph)*Math.cos(de)*Math.cos(Hh);
const al=Math.asin(Math.max(-1,Math.min(1,sa)));
const az=Math.atan2(Math.sin(Hh),Math.cos(Hh)*Math.sin(ph)-Math.tan(de)*Math.cos(ph));
let azG=(Math.PI+az+2*Math.PI)%(2*Math.PI);
let azW=(azG+SUN_ROT+2*Math.PI)%(2*Math.PI);
const D=42;
return{x:8+D*Math.cos(al)*Math.sin(azW),y:D*Math.sin(al),z:8-D*Math.cos(al)*Math.cos(azW),al,azG};}
